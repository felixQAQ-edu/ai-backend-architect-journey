spring:
  datasource:
    # 测试用内存 H2 — 跟主程序的 ./data/learn 文件库完全隔离,避免污染开发数据
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    open-in-view: false          # ADR-005 一致:测试 profile 与主程序保持相同 OSIV 关闭策略
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

# 测试中不真实调用 LLM,给个占位 key 让 LangChain4j Spring autoconfig 能正常构造 bean
langchain4j:
  open-ai:
    streaming-chat-model:
      api-key: test-key-not-used
      base-url: https://test.invalid/v1
      log-requests: false
      log-responses: false

# 测试日志放安静一点,让测试输出更清爽
logging:
  level:
    root: WARN
    com.felix.chatpipeline: INFO
    org.flywaydb: INFO
